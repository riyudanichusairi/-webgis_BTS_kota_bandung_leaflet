<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGIS Sebaran Menara</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
        }
        #map {
            height: 100vh;
            width: 100vw;
        }
        .info-popup {
            font-family: sans-serif;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        // 1. Inisialisasi Peta (Koordinat pusat contoh di Indonesia/Lamongan, zoom level 12)
        var map = L.map('map').setView([-7.1167, 112.4167], 12);

        // 2. Tambahkan Base Layer (OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://openstreetmap.org">OpenStreetMap</a> contributors'
        }).addTo(map);

        // 3. Data Titik Menara (Contoh Data Dummy - Bisa diganti GeoJSON)
        var dataMenara = [
            {
                nama: "Menara BTS Telkomsel - Kota",
                operator: "Telkomsel",
                tinggi: "42 meter",
                lat: -7.1150,
                lng: 112.4200
            },
            {
                nama: "Menara BTS Indosat - Babat",
                operator: "Indosat Ooredoo",
                tinggi: "35 meter",
                lat: -7.1210,
                lng: 112.4100
            },
            {
                nama: "Menara BTS XL - Paciran",
                operator: "XL Axiata",
                tinggi: "50 meter",
                lat: -7.1080,
                lng: 112.4300
            }
        ];

        // 4. Tambahkan Marker Menara ke Peta
        dataMenara.forEach(function(menara) {
            var marker = L.marker([menara.lat, menara.lng]).addTo(map);

            var popupContent = `
                <div class="info-popup">
                    <b>${menara.nama}</b><br>
                    <b>Operator:</b> ${menara.operator}<br>
                    <b>Tinggi Menara:</b> ${menara.tinggi}
                </div>
            `;
            marker.bindPopup(popupContent);
        });
    </script>
</body>
</html>
